<div class="auth-page">
  <div class="register-container">
    <div class="register-card">
      <div class="register-header text-center">
        <a routerLink="/" class="brand-link">
          <div class="brand-logo"><i class="fa-solid fa-shield-halved"></i></div>
          <span class="brand-name">BankEase</span>
        </a>
        <h1>Open a Digital Bank Account</h1>
        <p>Instant account opening with zero branch visits. Ready in 60 seconds.</p>
      </div>

      <!-- Error Alert -->
      <div class="alert alert-danger" *ngIf="errorMessage()">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMessage() }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" class="register-form">
        <div class="form-grid">
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="name">Full Name *</label>
            <input type="text" id="name" name="name" [(ngModel)]="name" class="form-control" placeholder="e.g. Ramesh Patel" required />
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" class="form-control" placeholder="name@example.com" required />
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label class="form-label" for="phone">Mobile Phone *</label>
            <input type="tel" id="phone" name="phone" [(ngModel)]="phone" class="form-control" placeholder="+91 98765 43210" required />
          </div>

          <!-- Account Type -->
          <div class="form-group">
            <label class="form-label" for="accountType">Account Type</label>
            <select id="accountType" name="accountType" [(ngModel)]="accountType" class="form-control form-select">
              <option value="SAVINGS">Savings Account (4.0% Interest p.a.)</option>
              <option value="CURRENT">Current Account (Business Banking)</option>
              <option value="SALARY">Corporate Salary Account</option>
            </select>
          </div>

          <!-- Address -->
          <div class="form-group full-width">
            <label class="form-label" for="address">Residential Address *</label>
            <input type="text" id="address" name="address" [(ngModel)]="address" class="form-control" placeholder="Flat No, Street, City, State & PIN" required />
          </div>

          <!-- Username -->
          <div class="form-group">
            <label class="form-label" for="username">Choose NetBanking Username *</label>
            <input type="text" id="username" name="username" [(ngModel)]="username" class="form-control" placeholder="e.g. ramesh_patel" required />
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">Create Secure Password *</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" class="form-control" placeholder="Min. 6 characters" required />
          </div>

          <!-- Initial Deposit -->
          <div class="form-group full-width">
            <label class="form-label" for="deposit">Opening Initial Deposit (INR)</label>
            <input type="number" id="deposit" name="deposit" [(ngModel)]="initialDeposit" class="form-control" min="0" step="500" placeholder="1000" />
            <span class="text-xs text-muted">Simulated credit will be immediately deposited into your newly generated account number.</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" [disabled]="loading()">
          <span *ngIf="!loading()"><i class="fa-solid fa-check-circle"></i> Create BankEase Account</span>
          <span *ngIf="loading()"><i class="fa-solid fa-spinner fa-spin"></i> Provisioning Account...</span>
        </button>
      </form>

      <div class="register-footer text-center">
        <p>Already have an account? <a routerLink="/login">Sign In here</a></p>
      </div>
    </div>
  </div>
</div>
