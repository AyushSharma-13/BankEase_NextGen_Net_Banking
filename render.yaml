services:
  # Backend API Web Service
  - type: web
    name: bankease-backend
    env: docker
    dockerfilePath: ./BankEase-Backend/Dockerfile
    dockerContext: ./BankEase-Backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET
        value: BankEaseNextGenSecureSecretKeyForJWTAuthTokenGeneration2026BankEaseSuperSecureKey356

  # Frontend Web Service (Static Site)
  - type: static
    name: bankease-frontend
    buildCommand: cd BankEase-Frontend && npm install && npm run build
    staticPublishPath: ./BankEase-Frontend/dist/BankEase-Frontend/browser
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
