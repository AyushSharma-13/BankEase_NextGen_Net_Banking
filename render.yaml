services:
  # Backend API Web Service
  - type: web
    name: bankease-backend
    runtime: docker
    dockerfilePath: ./BankEase-Backend/Dockerfile
    dockerContext: ./BankEase-Backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: BANKEASE_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET
        value: BankEaseNextGenSecureSecretKeyForJWTAuthTokenGeneration2026BankEaseSuperSecureKey356
