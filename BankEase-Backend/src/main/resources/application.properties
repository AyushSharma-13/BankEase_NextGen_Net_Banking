# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=

# Application Name
spring.application.name=bankease-backend

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA & Hibernate Settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Security Configuration
bankease.jwt.secret=BankEaseNextGenSecureSecretKeyForJWTAuthTokenGeneration2026BankEaseSuperSecureKey356
bankease.jwt.expiration-ms=86400000

# CORS Configuration
bankease.cors.allowed-origins=*

# Actuator
management.endpoints.web.exposure.include=health,info
