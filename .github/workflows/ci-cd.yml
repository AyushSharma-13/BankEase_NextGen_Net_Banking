name: BankEase CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build-test:
    name: Backend Build & Test (Spring Boot Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Backend Tests
        run: |
          cd BankEase-Backend
          mvn -B test --file pom.xml

      - name: Package Executable JAR
        run: |
          cd BankEase-Backend
          mvn -B package -DskipTests --file pom.xml

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bankease-backend-jar
          path: BankEase-Backend/target/*.jar

  frontend-build:
    name: Frontend Build & Test (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: BankEase-Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd BankEase-Frontend
          npm ci

      - name: Build Angular Application for Production
        run: |
          cd BankEase-Frontend
          npm run build -- --configuration production

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bankease-frontend-dist
          path: BankEase-Frontend/dist/
